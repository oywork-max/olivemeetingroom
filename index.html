<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OLIVE Meeting Room</title>
    <link rel="manifest" href="manifest.json">
    <link class="no-print" rel="apple-touch-icon" href="icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* 1. 기본 테마 (올리브/코랄) - 눈이 편안한 #9BCE26 */
        :root, [data-theme="default"] {
            --bg-primary: #f9f9f7;
            --bg-card: #ffffff;
            --text-primary: #222222;
            --text-secondary: #666666;
            --color-olive: #9BCE26; 
            --color-olive-dark: #7aab15;
            --color-coral: #FF7878;
            --border-color: #e5e5e0;
            --input-bg: #f4f4f0;
        }

        /* 2. 다크 모드 (무채색 그레이 계열) */
        [data-theme="dark"] {
            --bg-primary: #121212;
            --bg-card: #1e1e1e;
            --text-primary: #f5f5f5;
            --text-secondary: #aaaaaa;
            --color-olive: #888888;
            --color-olive-dark: #cccccc;
            --color-coral: #dc3545;
            --border-color: #333333;
            --input-bg: #2a2a2a;
        }

        /* 3. 퍼플/핑크 테마 */
        [data-theme="purple"] {
            --bg-primary: #f8f5fa;
            --bg-card: #ffffff;
            --text-primary: #332b3b;
            --text-secondary: #7f748a;
            --color-olive: #9b59b6;
            --color-olive-dark: #71368a;
            --color-coral: #e84393;
            --border-color: #eadced;
            --input-bg: #f3ebf5;
        }

        /* 4. 블루/그레이 테마 (요청 헥스코드 반영) */
        [data-theme="blue"] {
            --bg-primary: #f0f2f5;
            --bg-card: #ffffff;
            --text-primary: #1C1C1D;
            --text-secondary: #666666;
            --color-olive: #2043BF;
            --color-olive-dark: #153090;
            --color-coral: #dc3545;
            --border-color: #d1d5db;
            --input-bg: #e4e6eb;
        }

        /* 5. 옐로우/다크퍼플 테마 (요청 헥스코드 반영) */
        [data-theme="yellow"] {
            --bg-primary: #160C28;
            --bg-card: #231640;
            --text-primary: #ffffff;
            --text-secondary: #b3a9c4;
            --color-olive: #EDC65B;
            --color-olive-dark: #c4a13d;
            --color-coral: #ff7878;
            --border-color: #3a2760;
            --input-bg: #2d1d52;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
        
        body { 
            background-color: var(--bg-primary); 
            color: var(--text-primary); 
            padding: 10px 8px 20px; /* 모바일 여백 극대화 */
            max-width: 100%; 
            width: 1200px;
            margin: 0 auto; 
            min-height: 100vh;
        }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px; }
        h1 { font-size: 1.2rem; color: var(--color-olive); font-weight: 800; }
        h1 span { color: var(--color-coral); }

        .step-indicator { display: flex; gap: 4px; margin-bottom: 12px; width: 100%; padding: 0 4px; }
        .step-bar { flex: 1; height: 4px; background: var(--border-color); border-radius: 4px; }
        .step-bar.active { background: var(--color-olive); }

        .card { background: var(--bg-card); border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 4px; }
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-left: 3px solid var(--color-olive); padding-left: 6px; }
        h2 { font-size: 0.95rem; border-left: 3px solid var(--color-olive); padding-left: 6px; margin-bottom: 8px; }
        .card-header-flex h2 { border-left: none; padding-left: 0; margin-bottom: 0; }

        .form-group { margin-bottom: 8px; width: 100%; display: flex; flex-direction: column; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; font-weight: 600; }
        
        input[type="text"], input[type="datetime-local"], select { 
            width: 100%; 
            padding: 10px 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            background: var(--input-bg); 
            color: var(--text-primary); 
            font-size: 0.9rem; 
            outline: none;
            -webkit-appearance: none;
        }
        
        .btn { width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; transition: opacity 0.2s; }
        .btn:active { opacity: 0.7; }
        .btn-primary { background: var(--color-olive); color: #fff; }
        [data-theme="yellow"] .btn-primary { color: #160C28; } /* 옐로우 테마 글씨색 예외처리 */
        .btn-accent { background: var(--color-coral); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }
        .btn-small { width: auto; padding: 6px 10px; font-size: 0.8rem; border-radius: 6px; flex-shrink: 0; }

        .list-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; min-height: 10px; }
        .tag-item { background: var(--input-bg); padding: 4px 8px; border-radius: 12px; display: flex; align-items: center; gap: 4px; font-size: 0.8rem; border: 1px solid var(--border-color); user-select: none; }
        .tag-item i { color: var(--color-coral); cursor: pointer; font-size: 0.9rem; }

        /* 커스텀 체크박스 (iOS 호환) */
        .custom-checkbox {
            appearance: none; -webkit-appearance: none;
            width: 18px; height: 18px; border: 2px solid var(--color-olive); border-radius: 4px;
            display: inline-block; position: relative; cursor: pointer; flex-shrink: 0; background: var(--bg-card);
        }
        .custom-checkbox:checked { background-color: var(--color-olive); }
        .custom-checkbox:checked::after {
            content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
            border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
        }
        [data-theme="yellow"] .custom-checkbox:checked::after { border-color: #160C28; }

        .select-item-label { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--input-bg); border-radius: 8px; margin-bottom: 6px; cursor: pointer; width: 100%; border: 1px solid transparent; }
        .select-item-label span { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .agenda-write-card { border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; margin-bottom: 10px; background: var(--bg-primary); }
        .agenda-write-card h3 { font-size: 0.9rem; color: var(--color-olive); margin-bottom: 8px; display: flex; align-items: center; gap:4px; }
        
        /* 텍스트 라인 컨테이너 */
        .line-input-group { 
            display: flex; align-items: flex-start; gap: 2px; margin-bottom: 6px; 
            width: 100%; position: relative; transition: all 0.2s ease;
        }
        
        /* 텍스트 에어리어 기본 스타일 */
        .line-input-group textarea { 
            flex: 1; min-height: 40px; height: auto; padding: 8px; line-height: 1.4; font-size: 0.9rem; 
            border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); 
            color: var(--text-primary); resize: none; outline: none;
        }
        
        /* [중요 복구 포인트] 부모 항목일 때 Bold 및 컬러 강조 */
        .line-input-group.is-parent textarea { 
            font-weight: 800 !important; 
            color: var(--color-olive-dark) !important; 
        }
        
        /* 들여쓰기 시 테두리 전체가 - 버튼까지 덮이도록 조정 */
        .line-input-group.indent { 
            background: var(--input-bg); 
            border: 1px solid var(--border-color);
            border-radius: 4px 10px 10px 4px;
            padding: 2px 2px 2px 8px; /* 좌측 여백을 최소한으로 주어 너비 확보 */
            margin-left: 12px;
            width: calc(100% - 12px); 
        }
        /* 들여쓰기 상태일 때 내부 텍스트창은 배경/선 투명화 */
        .line-input-group.indent textarea { 
            background: transparent; border: none; padding-left: 4px; box-shadow: none;
        }
        
        .btn-tree-toggle { background: none; border: none; color: var(--color-olive); padding: 8px 4px; cursor: pointer; font-size: 0.9rem; width: 22px; display: flex; justify-content: center; margin-top: 2px;}
        .btn-del-line { background: none; border: none; color: var(--text-secondary); padding: 8px 6px; cursor: pointer; display: flex; justify-content: center; align-items: center; margin-top: 2px;}

        /* 행 추가 중간 화살표 */
        .btn-insert-below { text-align: center; color: var(--color-coral); cursor: pointer; margin: -4px 0 2px 0; z-index: 10; position: relative; font-size: 1.2rem; line-height: 1; transition: transform 0.1s; padding: 4px 0; }
        .btn-insert-below:active { transform: scale(1.1); }
        .btn-insert-below i { background: var(--bg-card); padding: 0 10px; border-radius: 4px; }

        .all-select-wrap { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--text-secondary); }

        .capture-wrapper { background: var(--bg-card); padding: 4px; border-radius: 8px; }
        .result-view { white-space: pre-wrap; background: var(--input-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); line-height: 1.5; font-size: 0.85rem; color: var(--text-primary); }
        
        .forced-light {
            --bg-card: #ffffff !important;
            --input-bg: #f4f4f0 !important;
            --text-primary: #222222 !important;
            --border-color: #e5e5e0 !important;
        }
        .forced-light .result-view { color: #222222 !important; background: #f4f4f0 !important; border-color: #e5e5e0 !important; }

        .hidden { display: none !important; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .mt-10 { margin-top: 8px; }
        .mt-12 { margin-top: 10px; }

        /* 테마 선택 모달 스타일 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        .theme-btn { justify-content: flex-start; margin-bottom: 6px; padding: 12px; font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <h1>OLIVE <span>Meeting Room</span></h1>
        <button class="btn-outline btn-small" onclick="openThemeModal()"><i class="fa-solid fa-palette"></i> 테마</button>
    </header>

    <div class="step-indicator">
        <div class="step-bar active" id="bar-1"></div>
        <div class="step-bar" id="bar-2"></div>
        <div class="step-bar" id="bar-3"></div>
        <div class="step-bar" id="bar-4"></div>
    </div>

    <!-- 1단계: 기본 설정 -->
    <div id="step-setup">
        <div class="card">
            <h2>기본 정보</h2>
            <div class="form-group">
                <label>회의 제목</label>
                <input type="text" id="meet-title" placeholder="예: 주간 매장 점검 회의">
            </div>
            <div class="form-group">
                <label>회의 일시</label>
                <input type="datetime-local" id="meet-date">
            </div>
        </div>

        <div class="card">
            <h2>참석자 등록</h2>
            <div style="display:flex; gap:6px; width:100%;">
                <input type="text" id="member-input" placeholder="이름 입력 후 엔터" onkeydown="if(event.keyCode==13) addMember()">
                <button class="btn btn-primary btn-small" onclick="addMember()">등록</button>
            </div>
            <div id="member-list" class="list-container"></div>
        </div>

        <div class="card">
            <h2>회의 안건 관리</h2>
            <div style="display:flex; gap:6px; width:100%;">
                <input type="text" id="agenda-input" placeholder="안건 입력 후 엔터" onkeydown="if(event.keyCode==13) addAgenda()">
                <button class="btn btn-primary btn-small" onclick="addAgenda()">등록</button>
            </div>
            <div id="agenda-list" class="list-container"></div>
        </div>

        <button class="btn btn-primary mt-10" onclick="switchStep(2)">회의 안건 선택 ➔</button>
        
        <div class="mt-12" style="text-align: center;">
            <button class="btn btn-outline" style="color: var(--color-coral); border-color: rgba(255,120,120,0.3); font-size:0.8rem; padding:8px;" onclick="clearAllCache()">
                <i class="fa-solid fa-trash-can"></i> 전체 캐시 초기화
            </button>
        </div>
    </div>

    <!-- 2단계: 안건 선택 -->
    <div id="step-select" class="hidden">
        <div class="card">
            <div class="card-header-flex">
                <h2>안건 선택</h2>
                <label class="all-select-wrap">
                    <input type="checkbox" class="custom-checkbox" id="all-agenda-select" onchange="toggleAllAgendas(this.checked)">
                    <span>전체 선택</span>
                </label>
            </div>
            <div id="select-zone"></div>
            <div class="grid-2 mt-10">
                <button class="btn btn-outline" onclick="switchStep(1)">이전</button>
                <button class="btn btn-accent" onclick="initWriteStep()">회의 시작 ➔</button>
            </div>
        </div>
    </div>

    <!-- 3단계: 회의 기록 작성 -->
    <div id="step-write" class="hidden">
        <div class="card" style="padding: 10px 8px;">
            <h2 style="margin-left: 4px;">회의 진행 기록</h2>
            <div id="write-zone"></div>
            <div class="grid-2 mt-10">
                <button class="btn btn-outline" onclick="switchStep(2)">안건 변경</button>
                <button class="btn btn-primary" onclick="renderResult()">회의 종료 ➔</button>
            </div>
        </div>
    </div>

    <!-- 4단계: 결과 확인 -->
    <div id="step-result" class="hidden">
        <div class="card">
            <h2>최종 회의록</h2>
            <div class="capture-wrapper" id="capture-area">
                <div class="result-view" id="result-text"></div>
            </div>
            
            <div class="mt-12">
                <button class="btn btn-accent" onclick="shareToSlack()" style="padding: 12px; font-size: 1rem;"><i class="fa-brands fa-slack"></i> 외부 공유하기</button>
            </div>

            <div class="grid-2 mt-10">
                <button class="btn btn-outline" onclick="copyText()"><i class="fa-regular fa-copy"></i> 텍스트 복사</button>
                <button class="btn btn-primary" onclick="downloadAsPNG()"><i class="fa-solid fa-file-image"></i> 이미지 저장</button>
            </div>
            
            <div class="grid-2 mt-12" style="border-top: 1px dashed var(--border-color); padding-top: 12px;">
                <button class="btn btn-outline" onclick="switchStep(3)"><i class="fa-solid fa-chevron-left"></i> 이전</button>
                <button class="btn btn-outline" style="color:var(--color-coral); border-color: rgba(255,120,120,0.3);" onclick="location.reload()">새 회의 시작</button>
            </div>
        </div>
    </div>

    <!-- 테마 선택 모달 -->
    <div id="theme-modal" class="modal-overlay hidden">
        <div class="card" style="width: 85%; max-width: 320px; padding: 20px;">
            <h2 style="margin-bottom: 16px; font-size:1.1rem;"><i class="fa-solid fa-palette"></i> 테마 선택</h2>
            <button class="btn btn-outline theme-btn" onclick="setTheme('default')">🟢 올리브영 (기본)</button>
            <button class="btn btn-outline theme-btn" onclick="setTheme('dark')">⚫ 다크 모드 (그레이)</button>
            <button class="btn btn-outline theme-btn" onclick="setTheme('purple')">🟣 퍼플 & 핑크</button>
            <button class="btn btn-outline theme-btn" onclick="setTheme('blue')">🔵 블루 & 그레이</button>
            <button class="btn btn-outline theme-btn" onclick="setTheme('yellow')">🟡 옐로우 & 다크</button>
            <button class="btn btn-primary mt-10" onclick="closeThemeModal()">닫기</button>
        </div>
    </div>

    <script>
        let state = {
            title: "", date: "", 
            members: [], 
            agendas: ["전사전략공유", "공유사항"],
            selected: [],
            contents: {}
        };

        window.onload = () => {
            // 저장된 테마 불러오기
            const savedTheme = localStorage.getItem('olive_theme') || 'default';
            document.documentElement.setAttribute('data-theme', savedTheme);

            // 데이터 불러오기
            const saved = localStorage.getItem('olive_pwa_data_v4_tree');
            if(saved) state = JSON.parse(saved);
            renderSetup();
            
            // 날짜 기본값 세팅
            if(!state.date) {
                const now = new Date();
                now.setHours(now.getHours() + 1);
                now.setMinutes(0);
                now.setSeconds(0);
                const offset = now.getTimezoneOffset() * 60000;
                const localISOTime = new Date(now.getTime() - offset).toISOString().slice(0, 16);
                document.getElementById('meet-date').value = localISOTime;
            } else {
                document.getElementById('meet-date').value = state.date;
            }
            
            // 텍스트에어리어 자동 높이 조절
            document.addEventListener('input', function (e) {
                if (e.target.tagName.toLowerCase() === 'textarea' && e.target.closest('.line-input-group')) {
                    e.target.style.height = 'auto';
                    e.target.style.height = e.target.scrollHeight + 'px';
                }
            });
        };

        // --- 테마 관련 기능 ---
        function openThemeModal() { document.getElementById('theme-modal').classList.remove('hidden'); }
        function closeThemeModal() { document.getElementById('theme-modal').classList.add('hidden'); }
        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('olive_theme', themeName);
            closeThemeModal();
        }

        // --- 상태 저장 및 초기화 ---
        function save() { 
            state.title = document.getElementById('meet-title').value;
            state.date = document.getElementById('meet-date').value;
            localStorage.setItem('olive_pwa_data_v4_tree', JSON.stringify(state)); 
        }

        function clearAllCache() {
            if(confirm("모든 캐시 데이터가 초기화됩니다. 진행할까요?")) {
                localStorage.removeItem('olive_pwa_data_v4_tree');
                location.reload();
            }
        }

        // --- 멤버 및 안건 관리 ---
        function addMember() {
            const val = document.getElementById('member-input').value.trim();
            if(val) { state.members.push(val); document.getElementById('member-input').value = ""; renderSetup(); save(); }
        }
        function delMember(idx) { state.members.splice(idx, 1); renderSetup(); save(); }

        function addAgenda() {
            const val = document.getElementById('agenda-input').value.trim();
            if(val) { state.agendas.push(val); document.getElementById('agenda-input').value = ""; renderSetup(); save(); }
        }
        function delAgenda(idx) { state.agendas.splice(idx, 1); renderSetup(); save(); }

        function renderSetup() {
            document.getElementById('member-list').innerHTML = state.members.map((m, i) => `
                <div class="tag-item">${m} <i class="fa-solid fa-xmark" onclick="delMember(${i})"></i></div>
            `).join('');
            
            document.getElementById('agenda-list').innerHTML = state.agendas.map((a, i) => `
                <div class="tag-item">${a} <i class="fa-solid fa-xmark" onclick="delAgenda(${i})"></i></div>
            `).join('');
            
            document.getElementById('meet-title').value = state.title || "";
        }

        // --- 단계 이동 ---
        function switchStep(n) {
            document.querySelectorAll('body > div[id^="step-"]').forEach(div => div.classList.add('hidden'));
            const ids = ['step-setup', 'step-select', 'step-write', 'step-result'];
            document.getElementById(ids[n-1]).classList.remove('hidden');
            
            for(let i=1; i<=4; i++) {
                const bar = document.getElementById(`bar-${i}`);
                if(i <= n) bar.classList.add('active');
                else bar.classList.remove('active');
            }
            
            if(n === 2) renderSelect();
            save();
            window.scrollTo(0,0);
        }

        // --- 안건 선택 단계 ---
        function renderSelect() {
            const zone = document.getElementById('select-zone');
            zone.innerHTML = state.agendas.map(a => `
                <label class="select-item-label">
                    <input type="checkbox" class="custom-checkbox" value="${a}" ${state.selected.includes(a)?'checked':''} onchange="updateSingleSelect()">
                    <span>${a}</span>
                </label>
            `).join('');
            
            const totalBoxes = state.agendas.length;
            const checkedBoxes = state.selected.filter(x => state.agendas.includes(x)).length;
            document.getElementById('all-agenda-select').checked = (totalBoxes === checkedBoxes && totalBoxes > 0);
        }

        function toggleAllAgendas(isChecked) {
            const boxes = document.querySelectorAll('#select-zone input[type="checkbox"]');
            boxes.forEach(box => box.checked = isChecked);
            state.selected = isChecked ? [...state.agendas] : [];
            save();
        }

        function updateSingleSelect() {
            const checked = document.querySelectorAll('#select-zone input:checked');
            state.selected = Array.from(checked).map(c => c.value);
            document.getElementById('all-agenda-select').checked = (state.selected.length === state.agendas.length);
            save();
        }

        // --- 회의 작성 단계 ---
        function initWriteStep() {
            const checked = document.querySelectorAll('#select-zone input:checked');
            state.selected = Array.from(checked).map(c => c.value);
            if(state.selected.length === 0) return alert("진행할 안건을 최소 하나 선택해주세요.");
            
            state.selected.forEach(a => { 
                if(!state.contents[a] || state.contents[a].length === 0) {
                    state.contents[a] = [{ text: "", indent: false }]; 
                }
            });
            renderWriteZone();
            switchStep(3);
        }

        function renderWriteZone() {
            const zone = document.getElementById('write-zone');
            zone.innerHTML = state.selected.map(a => {
                const arr = state.contents[a];
                return `
                    <div class="agenda-write-card">
                        <h3><i class="fa-solid fa-thumbtack"></i> ${a}</h3>
                        <div id="lines-${a}">
                            ${arr.map((item, i) => {
                                // 다음 인덱스(i+1)가 존재하고 그 항목이 indent 상태이며, 현재(i) 항목은 indent가 아닐 경우 isParent = true
                                const isParent = (i < arr.length - 1 && arr[i+1].indent && !item.indent);
                                return `
                                    <div class="line-input-group ${item.indent ? 'indent' : ''} ${isParent ? 'is-parent' : ''}">
                                        <button class="btn-tree-toggle" onclick="toggleTreeIndent('${a}', ${i})">
                                            <i class="fa-solid ${item.indent ? 'fa-chevron-left' : 'fa-chevron-right'}"></i>
                                        </button>
                                        <textarea placeholder="${item.indent ? '상세 내용을 입력' : '주요 아젠다를 입력'}" oninput="updateLine('${a}', ${i}, this.value)">${item.text}</textarea>
                                        <button class="btn-del-line" onclick="delLine('${a}', ${i})"><i class="fa-solid fa-minus"></i></button>
                                    </div>
                                    ${i < arr.length - 1 ? `<div class="btn-insert-below" onclick="insertLineBelow('${a}', ${i})"><i class="fa-solid fa-caret-down"></i></div>` : ''}
                                `;
                            }).join('')}
                        </div>
                        <button class="btn btn-outline btn-small" onclick="addLine('${a}')" style="width:100%; margin-top:6px;">+ 내용 추가</button>
                    </div>
                `;
            }).join('');
        }

        function toggleTreeIndent(a, i) {
            state.contents[a][i].indent = !state.contents[a][i].indent;
            renderWriteZone(); save();
        }
        function insertLineBelow(a, i) {
            state.contents[a].splice(i + 1, 0, { text: "", indent: false });
            renderWriteZone(); save();
        }
        function addLine(a) { state.contents[a].push({ text: "", indent: false }); renderWriteZone(); save(); }
        function delLine(a, i) { if(state.contents[a].length > 1) { state.contents[a].splice(i, 1); renderWriteZone(); save(); } }
        function updateLine(a, i, val) { state.contents[a][i].text = val; save(); }

        // --- 결과 및 내보내기 ---
        function getRawReport() {
            let res = `📝 [회의록] ${state.title || '중례'}\n`;
            res += `일시: ${document.getElementById('meet-date').value.replace('T',' ')}\n`;
            res += `참석자: ${state.members.length > 0 ? state.members.join(', ') : '-'}\n`;
            res += `--------------------------\n`;
            state.selected.forEach(a => {
                res += `\n📌 ${a}\n`;
                if(state.contents[a]) {
                    state.contents[a].forEach(item => { 
                        if(item.text.trim()) {
                            if(item.indent) {
                                const subLines = item.text.split('\n').map((subLine, idx) => idx === 0 ? `   ◦ ${subLine}` : `     ${subLine}`).join('\n');
                                res += `${subLines}\n`;
                            } else {
                                const formattedLine = item.text.split('\n').map((subLine, idx) => idx === 0 ? ` - ${subLine}` : `   ${subLine}`).join('\n');
                                res += `${formattedLine}\n`; 
                            }
                        }
                    });
                }
            });
            return res;
        }

        function renderResult() {
            save();
            document.getElementById('result-text').innerText = getRawReport();
            switchStep(4);
        }

        // 복사 에러 방지 (try-catch 및 Fallback 우회 방식 적용)
        function copyText() {
            const textToCopy = getRawReport();
            
            // 모던 브라우저 API 시도
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert("클립보드에 복사되었습니다.");
                }).catch(err => {
                    fallbackCopyTextToClipboard(textToCopy);
                });
            } else {
                // 구형 브라우저 및 비보안 환경(HTTP) Fallback
                fallbackCopyTextToClipboard(textToCopy);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";  // 화면 스크롤 방지
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                alert("클립보드에 복사되었습니다.");
            } catch (err) {
                alert("복사 실패. 텍스트를 직접 드래그해서 복사해주세요.");
            }
            document.body.removeChild(textArea);
        }

        async function shareToSlack() {
            const reportText = getRawReport();
            if (navigator.share) {
                try { await navigator.share({ title: state.title || '회의록 전송', text: reportText }); } 
                catch (err) { console.log('공유 취소:', err); }
            } else {
                copyText(); // 복사 함수 재활용
                alert("시스템 공유 기능이 지원되지 않아 클립보드에 복사했습니다. 원하는 곳에 붙여넣기 해주세요.");
            }
        }

        function downloadAsPNG() {
            const wrapper = document.getElementById('capture-area');
            wrapper.classList.add('forced-light'); // 다크모드일때도 흰 배경으로 캡쳐되도록 강제

            html2canvas(wrapper, {
                scale: 2, 
                backgroundColor: '#ffffff',
                useCORS: true
            }).then(canvas => {
                wrapper.classList.remove('forced-light');
                const link = document.createElement('a');
                link.download = `회의록_${state.title || '중례'}.png`;
                link.href = canvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }).catch(err => {
                wrapper.classList.remove('forced-light');
                alert('이미지 생성 실패. 다시 시도해 주세요.');
                console.error(err);
            });
        }
    </script>
</body>
</html>
